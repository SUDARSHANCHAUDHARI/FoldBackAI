[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foldback"
version = "0.1.0"
description = "Lossless context compression for LLM agents. Fold it down, fold it back. No data dropped, prompt cache preserved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SudarshanTechLabs" }]
keywords = ["llm", "context", "compression", "tokens", "agents", "prompt-cache"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["foldback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
