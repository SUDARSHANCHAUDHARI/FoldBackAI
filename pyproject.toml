[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Distribution name is "foldback-ai" ("foldback" is taken on PyPI by an
# unrelated nagios package). The import package is still `foldback`:
#   pip install foldback-ai   ->   from foldback import compress
[project]
name = "foldback-ai"
version = "0.1.0"
description = "Lossless context compression for LLM agents. Fold it down, fold it back. No data dropped, prompt cache preserved."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sudarshan Chaudhari", email = "sunny.sudarshan@gmail.com" }]
keywords = ["llm", "context", "compression", "tokens", "agents", "prompt-cache"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SUDARSHANCHAUDHARI/FoldBack"
Repository = "https://github.com/SUDARSHANCHAUDHARI/FoldBack"
Issues = "https://github.com/SUDARSHANCHAUDHARI/FoldBack/issues"

[project.optional-dependencies]
exact = ["tiktoken>=0.7"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["foldback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=foldback --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
